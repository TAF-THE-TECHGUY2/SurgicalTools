server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API + uploaded files proxy to the Laravel backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /storage/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the service worker, or a browser keeps running the old one
    # and never learns there is a new build.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Nor the registration script that installs it.
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # Nor the SPA shell. index.html names the hashed bundle, and /assets/ is
    # immutable for a year — so a shell served from cache pins the browser to
    # whichever build it was fetched with, however many times the user
    # refreshes and whatever the server is actually serving. Without an
    # explicit header nginx sends none, and browsers then apply heuristic
    # caching of their own, which is how a deployed change can appear not to
    # have deployed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback. try_files' last argument is an internal redirect,
    # so the exact-match block above applies to "/" as well.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
